document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

/\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: transparent;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: transparent; border: 1px solid var(--color-divider);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 1px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg); border: 1px solid var(--color-divider);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"3fd731b5-dd31-4fcf-9637-25368328761a\"><\u002Fscript>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<style>/* vietnamese */\n@font-face {\n  font-family: 'Barlow Condensed';\n  f  de Origem\">Marca de Origem<\u002Foption><option value=\"Marca Adquirida\">Marca Adquirida<\u002Foption><option value=\"Fraqueza\">Fraqueza<\u002Foption>\n              <\u002Fsc-raw-select>\n              <label style=\"margin-left:auto;display:flex;align-items:center;gap:4px;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-neutral-700)\">{{ t.ptsLbl }} <input type=\"number\" value=\"{{ t.pts }}\" sc-camel-on-change=\"{{ t.onPts }}\" placeholder=\"0\" style=\"width:40px;background:transparent;border:0;border-bottom:1px solid var(--color-divider);font-family:'Barlow Condensed',sans-serif;font-size:16px;text-align:center;color:var(--color-text);padding:0;outline:none\"><\u002Flabel>\n              <button sc-camel-on-click=\"{{ t.remove }}\" title=\"Remover\" style=\"border:0;background:transparent;color:var(--color-neutral-500);cursor:pointer;font-size:18px;padding:0 2px\" style-hover=\"color:#7f2020\">×<\u002Fbutton>\n            <\u002Fdiv>\n            <input value=\"{{ t.n }}\" sc-camel-on-change=\"{{ t.onN }}\" placeholder=\"Nome\" style=\"width:100%;background:transparent;border:0;border-bottom:1px solid transparent;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:20px;letter-spacing:.04em;text-transform:uppercase;color:var(--color-text);padding:0;outline:none\" style-focus=\"border-bottom-color:var(--color-accent)\">\n            <textarea value=\"{{ t.d }}\" sc-camel-on-change=\"{{ t.onD }}\" placeholder=\"Efeito e complicação\" rows=\"2\" style=\"width:100%;background:transparent;border:0;font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--color-neutral-800);padding:0;outline:none;resize:vertical;field-sizing:content;min-height:40px;text-align:justify\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ addTrait }}\" style=\"margin-top:12px;background:transparent;border:1px solid var(--color-accent);color:var(--color-accent-700);border-radius:2px;padding:6px 14px;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer\" style-hover=\"background:var(--color-accent-100)\">+ Benefício, Marca ou Fraqueza<\u002Fbutton>\n      <p style=\"margin:10px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--color-neutral-700)\">5 pontos na criação. Fraquezas devolvem até mais 5. Marcas Adquiridas são pagas no próximo NVA ou com uma Fraqueza, por isso não entram na conta.<\u002Fp>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;border-bottom:1px solid var(--color-divider);padding-bottom:8px;margin-bottom:16px\">\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:14px;letter-spacing:.1em;color:#7f2020\">14<\u002Fspan>\n        <h2 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:26px;letter-spacing:.06em;text-transform:uppercase;margin:0;line-height:1\">Quem é você<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:24px 40px\">\n        <label style=\"display:grid;gap:6px;align-content:start\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700)\">Aparência<\u002Fspan>\n          <span style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--color-neutral-700)\">Duas ou três frases.<\u002Fspan>\n          <textarea value=\"{{ b.aparencia.v }}\" sc-camel-on-change=\"{{ b.aparencia.on }}\" rows=\"3\" style=\"width:100%;background:transparent;border:0;border-bottom:1px solid var(--color-divider);font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--color-text);padding:4px 2px;outline:none;resize:vertical;field-sizing:content;min-height:72px;text-align:justify\" style-focus=\"border-bottom-color:var(--color-accent)\"><\u002Ftextarea><\u002Flabel>\n        <label style=\"display:grid;gap:6px;align-content:start\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700)\">Laços<\u002Fspan>\n          <span style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--color-neutral-700)\">Quem aqui você já conhecia antes?<\u002Fspan>\n          <textarea value=\"{{ b.lacos.v }}\" sc-camel-on-change=\"{{ b.lacos.on }}\" rows=\"3\" style=\"width:100%;background:transparent;border:0;border-bottom:1px solid var(--color-divider);font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--color-text);padding:4px 2px;outline:none;resize:vertical;field-sizing:content;min-height:72px;text-align:justify\" style-focus=\"border-bottom-color:var(--color-accent)\"><\u002Ftextarea><\u002Flabel>\n        <label style=\"display:grid;gap:6px;align-content:start\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#7f2020\">Segredo<\u002Fspan>\n          <span style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--color-neutral-700)\">O que você ainda não contou para ninguém?<\u002Fspan>\n          <textarea value=\"{{ b.segredo.v }}\" sc-camel-on-change=\"{{ b.segredo.on }}\" rows=\"3\" style=\"width:100%;background:transparent;border:0;border-bottom:1px solid var(--color-divider);font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--color-text);padding:4px 2px;outline:none;resize:vertical;field-sizing:content;min-height:72px;text-align:justify\" style-focus=\"border-bottom-color:var(--color-accent)\"><\u002Ftextarea><\u002Flabel>\n        <label style=\"display:grid;gap:6px;align-content:start\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--color-accent-700)\">Anotações<\u002Fspan>\n          <span style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--color-neutral-700)\">Pistas, nomes, senhas, mapas.<\u002Fspan>\n          <textarea value=\"{{ b.notas.v }}\" sc-camel-on-change=\"{{ b.notas.on }}\" rows=\"5\" style=\"width:100%;background:transparent;border:0;border-bottom:1px solid var(--color-divider);font-family:var(--font-body);font-size:15px;line-height:1.55;color:var(--color-text);padding:4px 2px;outline:none;resize:vertical;field-sizing:content;min-height:110px\" style-focus=\"border-bottom-color:var(--color-accent)\"><\u002Ftextarea><\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showCheat }}\" hint-placeholder-val=\"{{ false }}\">\n  <section data-screen-label=\"Cheat Sheet\" style=\"break-before:page\">\n    <div style=\"background:#5f1a1a;color:#efece6;border-radius:var(--radius-md);padding:clamp(20px,5vw,28px) clamp(18px,5vw,32px);margin-bottom:32px;outline:1px solid #b68235;outline-offset:-8px\">\n      <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:500;font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:#e1ad66\">Apoio de mesa<\u002Fspan>\n      <h2 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:clamp(36px,5vw,56px);line-height:1;letter-spacing:.02em;text-transform:uppercase;margin:10px 0 12px;color:#fff\">O que fazer no seu turno<\u002Fh2>\n      <div style=\"width:96px;height:2px;background:#b68235;margin-bottom:12px\"><\u002Fdiv>\n      <p style=\"margin:0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;line-height:1.35;max-width:640px\">Uma Ação Principal, uma Ação Rápida, um Deslocamento e Ações Livres. Fora do turno, uma Reação. Use na ordem que quiser.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:36px 44px;align-items:start\">\n\n      <div>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;border-bottom:1px solid var(--color-text);padding-bottom:6px;margin-bottom:12px\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-size:14px;color:#7f2020\">I<\u002Fspan><h3 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:0\">As ações<\u002Fh3><\u002Fdiv>\n        <div style=\"display:grid;gap:10px;font-size:14px;line-height:1.5;text-align:justify\">\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Principal<\u002Fb> — Atacar, usar a maioria das Perícias, aplicar Kit Médico, Ajudar alguém Adjacente, ou Disparada (dobra o Deslocamento).<\u002Fp>\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Rápida<\u002Fb> — Sacar ou guardar arma, recarregar, usar Curativo, mexer numa porta ou alavanca, Habilidades de Ação Rápida. Acrobacia, Atletismo e Furtividade também cabem aqui.<\u002Fp>\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Deslocamento<\u002Fb> — Mover até o seu Deslocamento, podendo dividir antes e depois de agir. Levantar, escalar, pular um balcão ou entrar num veículo gasta ele inteiro.<\u002Fp>\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Livre<\u002Fb> — Falar uma frase curta, apontar, largar algo. Explicar um plano inteiro não é Livre.<\u002Fp>\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Reação<\u002Fb> — Uma por rodada, fora do seu turno. Esquiva e Bloqueio são de graça e valem contra todos os ataques. A Reação paga Contra-Ataque ou ação preparada.<\u002Fp>\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Longa<\u002Fb> — Troca Principal + Rápida por uma coisa só. Ainda move, usa Livres e reage.<\u002Fp>\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Completa<\u002Fb> — Troca Principal, Rápida e Reação. Só o Deslocamento continua. Usada para arrastar ou carregar um caído e para Kit Médico em quem está a 0 PV.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;border-bottom:1px solid var(--color-text);padding-bottom:6px;margin-bottom:12px\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-size:14px;color:#7f2020\">II<\u002Fspan><h3 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:0\">Atacar e defender<\u002Fh3><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;line-height:1.45;padding-bottom:10px;border-bottom:1px solid var(--color-divider);margin-bottom:10px\">\n          <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-700)\">Você ataca<\u002Fspan><span>3d6 + Atributo da arma contra a Esquiva ou o Bloqueio da criatura.<\u002Fspan>\n          <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-700)\">Você é atacado<\u002Fspan><span>3d6 + DES (Esquiva) ou + TEN (Bloqueio) contra 10 + ATQ da criatura.<\u002Fspan>\n        <\u002Fdiv>\n        <ul style=\"margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px;line-height:1.45\">\n          <li>Defesa bem-sucedida: dano zero, nenhum PA gasto.<\u002Fli>\n          <li>Defesa falhada: dano inteiro. Gaste 1 PA para reduzir à metade.<\u002Fli>\n          <li>Ataque que você não percebe acerta sem teste.<\u002Fli>\n          <li>Atirar em alvo Adjacente: Desvantagem.<\u002Fli>\n          <li>Uma faixa além do alcance: Desvantagem. Duas: impossível.<\u002Fli>\n          <li>Dado de Ascensão soma em todos os ataques.<\u002Fli>\n        <\u002Ful>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;border-bottom:1px solid var(--color-text);padding-bottom:6px;margin:24px 0 12px\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-size:14px;color:#7f2020\">III<\u002Fspan><h3 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:0\">Cobertura<\u002Fh3><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;line-height:1.45\">\n          <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-700)\">Parcial<\u002Fspan><span>Balcão, quina, carro. Ataques à distância contra você têm Desvantagem.<\u002Fspan>\n          <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-700)\">Total<\u002Fspan><span>Sem linha de tiro. Não pode ser alvo à distância.<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--color-neutral-700)\">Vale por ataque: sair de trás para atirar tira a proteção.<\u002Fp>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;border-bottom:1px solid var(--color-text);padding-bottom:6px;margin-bottom:12px\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-size:14px;color:#7f2020\">IV<\u002Fspan><h3 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:0\">Movimentos de combate<\u002Fh3><\u002Fdiv>\n        <div style=\"display:grid;gap:10px;font-size:14px;line-height:1.5;text-align:justify\">\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Agarrar<\u002Fb> — Oposição de Força. Se vencer, o alvo fica Segurado e você usa uma mão. Pode atacar ou estrangular (dano desarmado sem rolar). Atirar em quem está agarrado: Desvantagem, e o erro acerta o outro.<\u002Fp>\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Derrubar<\u002Fb> — Declarado no ataque. Acertou: alvo Derrubado e metade do dano. Com Margem 4+, dano normal.<\u002Fp>\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Desarmar<\u002Fb> — Como Derrubar, mas o alvo solta um objeto aos pés.<\u002Fp>\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Empurrar<\u002Fb> — Alvo Adjacente vai 2m + 1m por ponto de Força ({{ empurraTxt }}). Principal ou Rápida, uma vez por turno.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;border-bottom:1px solid var(--color-text);padding-bottom:6px;margin-bottom:12px\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-size:14px;color:#7f2020\">V<\u002Fspan><h3 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:0\">Preparar, Postura, Contra-Ataque<\u002Fh3><\u002Fdiv>\n        <div style=\"display:grid;gap:10px;font-size:14px;line-height:1.5;text-align:justify\">\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Preparar<\u002Fb> — Declare a ação e o gatilho exato (\"atiro no primeiro que passar pela porta\"). Gasta o turno e a Reação. Se o gatilho não vier até seu próximo turno, perdeu.<\u002Fp>\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Postura<\u002Fb> — Ação Longa que encerra o turno e dá uma Reação extra. Defensiva: ataques contra você com Desvantagem e Bloqueio com Vantagem. Evasiva: o mesmo, com Vantagem na Esquiva.<\u002Fp>\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Contra-Ataque<\u002Fb> — Após Esquiva ou Bloqueio bem-sucedido contra corpo a corpo: 1 PE + Reação para atacar na hora. Precisa de arma corpo a corpo ou mãos livres.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;border-bottom:1px solid var(--color-text);padding-bottom:6px;margin-bottom:12px\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-size:14px;color:#7f2020\">VI<\u002Fspan><h3 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:0\">Cair a 0 PV<\u002Fh3><\u002Fdiv>\n        <p style=\"margin:0 0 10px;font-size:14px;line-height:1.5;text-align:justify\">Você recebe 1 Ferimento e escolhe. Se for o 3º Ferimento, não há escolha: morte.<\u002Fp>\n        <div style=\"display:grid;gap:10px;font-size:14px;line-height:1.5;text-align:justify\">\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Evitar a Morte<\u002Fb> — Inconsciente, não pode ser alvo de ataques. Acorda com cura de outra pessoa ou Descanso Longo. Repetir na mesma cena: 3d6, com 10 ou menos perde 1 PD para sempre.<\u002Fp>\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Desafiar a Morte<\u002Fb> — Role 3d6. Com 11+ volta com {{ desafioTxt }} PV. Com 10 ou menos, morre.<\u002Fp>\n          <p style=\"margin:0\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">Sacrifício Glorioso<\u002Fb> — Uma última ação, Sucesso Crítico automático, com aprovação do Mestre. Depois, morte.<\u002Fp>\n        <\u002Fdiv>\n        <p style=\"margin:10px 0 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--color-neutral-700)\">Dano de área e ambiental ainda atingem o caído: cada vez, 1 Ferimento.<\u002Fp>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;border-bottom:1px solid var(--color-text);padding-bottom:6px;margin-bottom:12px\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-size:14px;color:#7f2020\">VII<\u002Fspan><h3 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:0\">Determinação<\u002Fh3><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;font-size:14px;line-height:1.4\">\n          <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-700);border-bottom:1px solid var(--color-text);padding-bottom:4px\">Uso<\u002Fspan><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-700);border-bottom:1px solid var(--color-text);padding-bottom:4px\">Custo<\u002Fspan><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--color-accent-700);border-bottom:1px solid var(--color-text);padding-bottom:4px\">Limite<\u002Fspan>\n          <span>Re-rolar um teste (fica o 2º)<\u002Fspan><span>1 PD<\u002Fspan><span>Livre<\u002Fspan>\n          <span>Ignorar Ferimentos até seu próximo turno<\u002Fspan><span>1 PD<\u002Fspan><span>Livre<\u002Fspan>\n          <span>Emprestar uma Habilidade<\u002Fspan><span>1 PD + PE<\u002Fspan><span>Livre<\u002Fspan>\n          <span>Ação Principal adicional<\u002Fspan><span>1 PD<\u002Fspan><span>1× cena<\u002Fspan>\n          <span>Reação adicional<\u002Fspan><span>1 PD<\u002Fspan><span>1× turno<\u002Fspan>\n          <span>Segurar uma Falha Grave<\u002Fspan><span>1 PD<\u002Fspan><span>1× sessão<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;border-bottom:1px solid var(--color-text);padding-bottom:6px;margin-bottom:12px\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-size:14px;color:#7f2020\">VIII<\u002Fspan><h3 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:0\">Dificuldade e Margem<\u002Fh3><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:6px;margin-bottom:14px\">\n          <div style=\"border:1px solid var(--color-divider);padding:6px 4px;text-align:center\"><div style=\"font-family:'Barlow Condensed',sans-serif;font-size:24px;line-height:1\">10<\u002Fdiv><div style=\"font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700)\">Simples<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--color-divider);padding:6px 4px;text-align:center\"><div style=\"font-family:'Barlow Condensed',sans-serif;font-size:24px;line-height:1\">12<\u002Fdiv><div style=\"font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700)\">Normal<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--color-divider);padding:6px 4px;text-align:center\"><div style=\"font-family:'Barlow Condensed',sans-serif;font-size:24px;line-height:1\">15<\u002Fdiv><div style=\"font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700)\">Desafiador<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--color-divider);padding:6px 4px;text-align:center\"><div style=\"font-family:'Barlow Condensed',sans-serif;font-size:24px;line-height:1\">18<\u002Fdiv><div style=\"font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700)\">Difícil<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--color-divider);padding:6px 4px;text-align:center\"><div style=\"font-family:'Barlow Condensed',sans-serif;font-size:24px;line-height:1\">21<\u002Fdiv><div style=\"font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700)\">Absurdo<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid #7f2020;padding:6px 4px;text-align:center\"><div style=\"font-family:'Barlow Condensed',sans-serif;font-size:24px;line-height:1;color:#7f2020\">25<\u002Fdiv><div style=\"font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-neutral-700)\">Extremo<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;line-height:1.45\">\n          <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;color:#7f2020\">−1 ou menos<\u002Fspan><span><b>Falha.<\u002Fb> Não acontece e a cena piora.<\u002Fspan>\n          <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--color-accent-700)\">0<\u002Fspan><span><b>Parcial.<\u002Fb> Consegue, com um preço.<\u002Fspan>\n          <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--color-accent-700)\">+1 a +3<\u002Fspan><span><b>Pleno.<\u002Fb> Exatamente o que queria.<\u002Fspan>\n          <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;color:var(--color-accent-700)\">+4 ou mais<\u002Fspan><span><b>Melhorado.<\u002Fb> O que queria e algo mais.<\u002Fspan>\n        <\u002Fdiv>\n        <ul style=\"margin:12px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14px;line-height:1.45\">\n          <li>Par de 6 atingindo o VD: Sucesso Crítico. Sem atingir: conta como Parcial.<\u002Fli>\n          <li>Trio de 6: Sucesso Absoluto, qualquer que seja o VD.<\u002Fli>\n          <li>Vantagem: role duas vezes, fique com o maior. Extras viram +1 (até +3). Vantagem e Desvantagem se anulam aos pares.<\u002Fli>\n          <li>Falhou? Pode aceitar Vitória por um Custo.<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div style=\"grid-column:1 / -1\">\n        <div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;border-bottom:1px solid var(--color-text);padding-bottom:6px;margin-bottom:12px\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-size:14px;color:#7f2020\">IX<\u002Fspan><h3 style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase;margin:0\">Condições<\u002Fh3><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:10px 28px\">\n          <sc-for list=\"{{ condRef }}\" as=\"k\" hint-placeholder-count=\"14\">\n            <p style=\"margin:0;font-size:13.5px;line-height:1.45;text-wrap:pretty\"><b style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#7f2020\">{{ k.n }}<\u002Fb> — {{ k.d }}<\u002Fp>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <\u002Fsc-if>\n\n  <footer style=\"margin-top:48px;padding-top:14px;border-top:1px solid var(--color-divider);display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--color-neutral-600)\">\n    <span>Sangue e Névoa<\u002Fspan><span>{{ footerTxt }}<\u002Fspan>\n  <\u002Ffooter>\n  \n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst KEY = 'sangue-nevoa-fichas-v1';\nconst BLOOD = '#7f2020';\nconst ATTR = [\n  { k: 'for', l: 'Força', a: 'FOR' }, { k: 'ten', l: 'Tenacidade', a: 'TEN' }, { k: 'des', l: 'Destreza', a: 'DES' },\n  { k: 'men', l: 'Mente', a: 'MEN' }, { k: 'esp', l: 'Espírito', a: 'ESP' }, { k: 'cha', l: 'Charme', a: 'CHA' }\n];\nconst PER = [['Acrobacia','des'],['Arrombamento','des'],['Atletismo','for'],['Condução','des'],['Diplomacia','cha'],['Enganação','cha'],['Furtividade','des'],['Intimidação','cha'],['Intuição','esp'],['Investigação','men'],['Linguagem','men'],['Medicina','men'],['Percepção','esp'],['Performance','cha'],['Persuasão','cha'],['Prestidigitação','des'],['Sedução','cha'],['Sobrevivência','esp'],['Tecnologia','men'],['Trato com Animais','esp'],['Vontade','esp']];\nconst FOCOS = {\n  'Ofício (Alfaiataria)':'des','Ofício (Armaria)':'des','Ofício (Cartografia)':'men','Ofício (Culinária)':'des','Ofício (Desenho e Pintura)':'des','Ofício (Disfarce)':'des','Ofício (Escrita)':'men','Ofício (Falsificação)':'des','Ofício (Herbalismo)':'men',\n  'Conhecimento (Arcanismo)':'men','Conhecimento (Arquitetura)':'men','Conhecimento (Ciências)':'men','Conhecimento (Geografia)':'men','Conhecimento (Guerra)':'men','Conhecimento (História)':'men','Conhecimento (Leis)':'men','Conhecimento (Matemática)':'men','Conhecimento (Ocultismo)':'esp','Conhecimento (Psicologia)':'men','Conhecimento (Religião)':'esp'\n};\nconst ESS = [\n  { n: 'Agente Infiltrado', r: 1100, h: 'Informação Compartimentada', d: 'Uma vez por sessão, declare que foi informado previamente sobre algo relevante ao que o grupo acabou de encontrar, e o Mestre confirma um fato verdadeiro sobre aquilo. Você também carrega um item pequeno que nenhuma revista encontrou, escolhido quando o revela, desde que caiba num bolso e valha até 100r.',\n    p: 'Acrobacia, Conhecimento (História), Conhecimento (Arcanismo), Conhecimento (Arquitetura), Atletismo, Conhecimento (Ciências), Condução, Ofício (Culinária), Ofício (Desenho e Pintura), Diplomacia, Ofício (Disfarce), Ofício (Escrita), Vontade, Furtividade, Conhecimento (Geografia), Intimidação, Investigação, Conhecimento (Leis), Percepção, Trato com Animais, Performance, Persuasão, Prestidigitação, Conhecimento (Psicologia), Sobrevivência, Conhecimento (Religião), Sedução, Tecnologia' },\n  { n: 'Fugitivo', r: 700, h: 'Instinto de Presa', d: 'Ao entrar num ambiente, você identifica sem teste todas as rotas de fuga, esconderijos utilizáveis e pontos onde uma emboscada seria armada. Uma vez por cena, ao se esconder, só é encontrado por criaturas que já sabiam exatamente onde você estava. Você também sente quando um espaço foi preparado para prender alguém, antes de entrar nele.',\n    p: 'Acrobacia, Sobrevivência, Arrombamento, Atletismo, Condução, Ofício (Disfarce), Ofício (Falsificação), Furtividade, Intimidação, Percepção, Trato com Animais, Persuasão, Prestidigitação, Sedução' },\n  { n: 'Investigador', r: 900, h: 'Leitura de Cena', d: 'Após examinar um local por pelo menos um minuto, você reconstrói o que aconteceu ali: quantas pessoas estiveram presentes, em que ordem se moveram e o que causou o estado da sala. O Mestre responde com verdade a uma pergunta sobre isso, uma vez por cena. Você percebe automaticamente quando alguém está mentindo ativamente. Omissão, não.',\n    p: 'Conhecimento (Arquitetura), Arrombamento, Atletismo, Condução, Diplomacia, Ofício (Disfarce), Vontade, Furtividade, Intimidação, Investigação, Conhecimento (Leis), Percepção, Trato com Animais, Acrobacia, Persuasão, Prestidigitação, Conhecimento (Psicologia), Sobrevivência, Sedução' },\n  { n: 'Jornalista', r: 700, h: 'Registro Obsessivo', d: 'Uma vez por cena, ao revisar seu próprio material, você recupera um detalhe que passou despercebido e faz uma pergunta ao Mestre sobre uma cena que o grupo já atravessou. Documentos, gravações e fotos que você produziu não podem ser contestados por quem tentar reescrever o que aconteceu.',\n    p: 'Performance, Diplomacia, Ofício (Escrita), Furtividade, Investigação, Linguagem, Percepção, Persuasão, Conhecimento (Psicologia), Sedução' },\n  { n: 'Médico', r: 900, h: 'Diagnóstico Preciso', d: 'Uma vez por sessão você pode examinar uma criatura e revelar exatamente qualquer condição, veneno, doença ou ferimento que ela sofra, sem teste. Um Kit Médico usado por você pode reverter um grau de Ferimento ou tirar uma criatura de 0 PV sem gastar o Kit.',\n    p: 'Conhecimento (História), Conhecimento (Ciências), Diplomacia, Vontade, Ofício (Herbalismo), Investigação, Linguagem, Conhecimento (Matemática), Medicina, Percepção, Conhecimento (Psicologia)' },\n  { n: 'Operativo', r: 1100, h: 'Instinto de Campo', d: 'O Mestre deve sinalizar com antecedência quando uma situação estiver a ponto de virar emboscada. Ao entrar num ambiente, você identifica de imediato a melhor posição defensiva e todas as saídas. Suas armas de fogo nunca emperram, e você as recarrega com uma Ação Livre em vez de uma Ação Rápida.',\n    p: 'Acrobacia, Ofício (Armaria), Arrombamento, Atletismo, Condução, Diplomacia, Ofício (Disfarce), Vontade, Furtividade, Conhecimento (História), Conhecimento (Religião), Intimidação, Investigação, Percepção, Linguagem, Medicina, Trato com Animais, Conhecimento (Ocultismo), Persuasão, Sobrevivência' },\n  { n: 'Pesquisador', r: 700, h: 'Fonte de Conhecimento', d: 'Você realiza testes de qualquer Conhecimento mesmo sem possuir o Foco, tratando a rolagem como Treinado. Uma vez por sessão, pode declarar que já estudou o assunto e obter a informação sem teste. Você também extrai o conteúdo essencial de qualquer documento, arquivo ou anotação com uma Ação Rápida.',\n    p: 'Acrobacia, Conhecimento (Arcanismo), Atletismo, Conhecimento (Ciências), Ofício (Culinária), Ofício (Desenho e Pintura), Diplomacia, Vontade, Furtividade, Ofício (Herbalismo), Medicina, Trato com Animais, Performance, Percepção, Prestidigitação, Sobrevivência, Conhecimento (Religião)' },\n  { n: 'Técnico', r: 900, h: 'Engenhosidade Incomparável', d: 'Você conserta, altera ou melhora qualquer dispositivo comum, e constrói aparelhos capazes de reproduzir som, vídeo ou executar tarefas simples. Problemas e detalhes de qualquer dispositivo eletrônico ou mecânico que você examine são sempre identificados.',\n    p: 'Conhecimento (Arcanismo), Ofício (Armaria), Arrombamento, Conhecimento (Ciências), Condução, Ofício (Desenho e Pintura), Diplomacia, Ofício (Escrita), Conhecimento (História), Investigação, Linguagem, Conhecimento (Matemática), Persuasão, Tecnologia' },\n  { n: 'Veterano', r: 1100, h: 'Instinto de Combate', d: 'Qualquer objeto do ambiente serve como arma improvisada nas suas mãos, sem a Desvantagem que isso normalmente imporia. Escuridão parcial, terreno instável, espaço apertado e clima severo não penalizam suas rolagens de combate ou movimento.',\n    p: 'Acrobacia, Atletismo, Vontade, Furtividade, Intimidação, Percepção, Sobrevivência, Investigação, Conhecimento (Guerra)' },\n  { n: 'Padre', r: 700, h: 'Palavras de Conforto', d: 'Uma vez por cena, com uma Ação Principal, você fala com um aliado que possa ouvi-lo e encerra nele a condição Abalado ou Amedrontado, sem gastar Analgésico. Uma vez por sessão, um aliado até Curto(6m) de você faz um Teste de Horror com Vantagem. Você também reconhece sem teste qualquer símbolo, oração ou rito religioso, e sabe dizer quando um deles foi distorcido de propósito.',\n    p: 'Conhecimento (História), Conhecimento (Ocultismo), Conhecimento (Psicologia), Conhecimento (Religião), Diplomacia, Intuição, Linguagem, Medicina, Ofício (Escrita), Performance, Persuasão, Vontade' },\n  { n: 'Bombeiro', r: 900, h: 'Protocolo de Resgate', d: 'Fumaça, calor e poeira não impõem Desvantagem aos seus testes, e você apaga as chamas de uma criatura Inflamada com uma Ação Rápida em vez de uma Ação Principal. Você carrega uma criatura Inconsciente ou Morrendo sem reduzir seu Deslocamento. Ao entrar numa estrutura, você identifica sem teste o que está prestes a ceder e o caminho mais rápido para fora.',\n    p: 'Acrobacia, Arrombamento, Atletismo, Condução, Conhecimento (Arquitetura), Conhecimento (Ciências), Diplomacia, Intimidação, Medicina, Percepção, Sobrevivência, Tecnologia, Vontade' },\n  { n: 'Professor', r: 700, h: 'Aula Improvisada', d: 'Uma vez por cena, com uma Ação Principal, você explica a um aliado como fazer algo em que você é Treinado ou Especialista. O próximo teste dele com aquela Perícia, ainda nesta cena, é feito como se ele fosse Treinado nela. Pessoas comuns em pânico seguem sem teste instruções simples suas, como fazer silêncio, formar fila ou ficar num lugar.',\n    p: 'Conhecimento (Ciências), Conhecimento (Geografia), Conhecimento (História), Conhecimento (Matemática), Conhecimento (Psicologia), Diplomacia, Intuição, Investigação, Linguagem, Ofício (Escrita), Performance, Persuasão, Vontade' },\n  { n: 'Mateiro', r: 700, h: 'Leitura da Mata', d: 'Ao examinar um rastro, você descobre sem teste que tipo de criatura o deixou, quantas eram e há quanto tempo passaram. Em ambiente natural, uma vez por Descanso Longo, você encontra 1 Suprimento sem teste. Você nunca se perde fora de construções, e se estiver em uma floresta ou mato o Mestre deve avisar quando algo está errado.',\n    p: 'Acrobacia, Atletismo, Condução, Conhecimento (Geografia), Furtividade, Intuição, Medicina, Ofício (Culinária), Ofício (Herbalismo), Percepção, Sobrevivência, Trato com Animais' },\n  { n: 'Comerciante', r: 1100, h: 'Experiência de Balcão', d: 'Você sabe sem teste quanto vale qualquer item comum, reconhece falsificações e percebe quando está sendo enganado numa negociação. Uma vez por sessão, ao vasculhar um lugar você acha um item de até 100r das tabelas de Itens Médicos ou de Utilidade que os outros deixaram passar. Sobreviventes dispostos a trocar sempre aceitam negociar com você.',\n    p: 'Condução, Conhecimento (Leis), Conhecimento (Matemática), Diplomacia, Enganação, Intimidação, Intuição, Linguagem, Ofício (Falsificação), Percepção, Persuasão, Prestidigitação' },\n  { n: 'Condutor', r: 900, h: 'Estrada na Veia', d: 'Você conduz qualquer veículo terrestre ou embarcação comum sem teste em situações normais, e tem Vantagem em testes de Condução em perseguições e manobras extremas. Com uma Ação Longa e Fita Adesiva, você faz um veículo parado voltar a andar até o fim da sessão. Em estradas e rios que já percorreu, você sempre sabe de um atalho, um posto ou um lugar onde parar.',\n    p: 'Atletismo, Condução, Conhecimento (Geografia), Diplomacia, Intimidação, Ofício (Cartografia), Ofício (Culinária), Percepção, Prestidigitação, Sobrevivência, Tecnologia, Vontade' },\n  { n: 'Herdeiro', r: 1100, h: 'Nome de Família', d: 'Autoridades, funcionários e gente de poder tratam você como alguém que pode causar problema se for contrariado, e seu primeiro teste social com cada um deles é feito com Vantagem. Uma vez por sessão, com um meio de comunicação funcionando, você faz uma ligação e consegue um favor simples, como transporte, um documento, acesso a um prédio ou uma informação. O Mestre decide o preço que a família vai cobrar depois.',\n    p: 'Atletismo, Condução, Conhecimento (História), Conhecimento (Leis), Diplomacia, Enganação, Intimidação, Intuição, Linguagem, Ofício (Desenho e Pintura), Performance, Persuasão, Sedução' },\n  { n: 'Negociador', r: 900, h: 'Mesa de Negociação', d: 'Uma pessoa disposta a ouvir não ataca você enquanto você estiver falando com ela, a menos que seja atacada ou ameaçada primeiro. Uma vez por cena, você faz uma pergunta direta a alguém com quem esteja conversando, e ele responde com verdade, a menos que passe num teste de Vontade VD 15. Isso vale para pessoas, não para o que já deixou de ser uma.',\n    p: 'Conhecimento (Leis), Conhecimento (Psicologia), Diplomacia, Enganação, Intimidação, Intuição, Linguagem, Percepção, Performance, Persuasão, Vontade' },\n  { n: 'Desertor', r: 700, h: 'Já Estive Lá Dentro', d: 'Você reconhece sem teste símbolos, sinais, hierarquias e rituais de seitas e grupos fechados, e se passa por membro de um deles enquanto ninguém de dentro o conhecer pessoalmente. Uma vez por sessão, diante de um ritual, um altar ou um local de culto, você pergunta ao Mestre para que aquilo serve, e ele responde com verdade. Qualquer membro do grupo que você deixou reconhece você à primeira vista.',\n    p: 'Conhecimento (Ocultismo), Conhecimento (Religião), Enganação, Furtividade, Intuição, Linguagem, Ofício (Disfarce), Performance, Persuasão, Prestidigitação, Sobrevivência, Vontade' },\n  { n: 'Artista', r: 700, h: 'O Show Não Pode Parar', d: 'Uma vez por cena, com uma Ação Principal, você cria uma distração num ponto até Médio (12m), seja uma voz, uma música ou um barulho encenado. Toda criatura que não esteja em combate com você se volta para lá até o fim do seu próximo turno. Você imita vozes e sotaques de quem ouviu por pelo menos um minuto, e a condição Abalado não impõe Desvantagem aos seus testes de Performance.',\n    p: 'Acrobacia, Diplomacia, Enganação, Intuição, Linguagem, Ofício (Desenho e Pintura), Ofício (Disfarce), Ofício (Escrita), Performance, Persuasão, Prestidigitação, Sedução' }\n];\nconst CONDS = [\n  ['abalado','Abalado','Desvantagem em testes de Ataque e de Perícia. Encerra com uma Ação Longa para se recompor ou um Analgésico.'],\n  ['amedrontado','Amedrontado','Desvantagem em todos os testes enquanto a fonte do medo estiver à vista. Não pode se aproximar dela.'],\n  ['atordoado','Atordoado','Escolhe só uma entre Deslocamento, Principal ou Rápida no turno. Deslocamento pela metade.'],\n  ['cego','Cego','Falha em testes que dependam de enxergar. Ataques contra você com Vantagem; os seus com Desvantagem.'],\n  ['derrubado','Derrubado','No chão. Deslocamento pela metade, seus ataques com Desvantagem. Adjacentes têm Vantagem contra você; de Curto ou mais, Desvantagem.'],\n  ['envenenado','Envenenado','Desvantagem em Ataque, Bloqueio e Esquiva. Um Soro encerra.'],\n  ['escondido','Escondido','Testes contra você com Desvantagem. Termina ao atacar ou ser visto.'],\n  ['imobilizado','Imobilizado','Deslocamento zero, Desvantagem em Destreza e nos seus ataques; ataques contra você com Vantagem. Escapa com Oposição de Força.'],\n  ['inconsciente','Inconsciente','Larga tudo e fica Derrubado. Falha em Bloqueio e Esquiva; ataques contra você com Vantagem.'],\n  ['  v; }); }; });\n    return o;\n  }\n\n  exportChar(c) {\n    const blob = new Blob([JSON.stringify(c, null, 2)], { type: 'application/json' });\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(blob);\n    a.download = ((c.nome || 'ficha').trim().replace(/[^\\wÀ-ú\\- ]/g, '') || 'ficha') + '.sangue-e-nevoa.json';\n    document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(() => URL.revokeObjectURL(a.href), 1000);\n  }\n  importFile(e) {\n    const f = e.target.files && e.target.files[0];\n    if (!f) return;\n    f.text().then(t => {\n      let d; try { d = JSON.parse(t); } catch (err) { alert('Arquivo inválido.'); return; }\n      const list = Array.isArray(d) ? d : Array.isArray(d.chars) ? d.chars : [d];\n      const chars = list.filter(x => x && typeof x === 'object').map(x => fix({ ...x, id: uid() }));\n      if (!chars.length) return;\n      this.setState(s => ({ chars: [...s.chars, ...chars], activeId: chars[0].id, tab: 'ficha' }));\n    });\n    e.target.value = '';\n  }\n\n  renderVals() {\n    const S = this.state;\n    const c = S.chars.find(x => x.id === S.activeId) || S.chars[0];\n    const A = c.attr;\n    const nva = Math.min(20, Math.max(1, num(c.nva) || 1));\n    const ess = ESS.find(e => e.n === c.essencia);\n    const essSet = new Set(ess ? ess.p.split(', ') : []);\n\n    const ptsTot = 10 + nva, lim = nva <= 7 ? 3 + nva : null;\n    const ptsUsed = ATTR.reduce((s, a) => s + num(A[a.k]), 0);\n    const pvMax = Math.max(1, 20 + 5 * (nva - 1) + 3 * num(A.ten) + num(c.bonus.pv));\n    const peMax = Math.max(0, 12 + 3 * (nva - 1) + num(c.bonus.pe));\n    const pvCur = c.pv === null ? pvMax : c.pv;\n    const peCur = c.pe === null ? peMax : c.pe;\n    const pdMax = num(c.pdMax);\n    const pdCur = c.pd === null ? pdMax : Math.min(num(c.pd), pdMax);\n    const dados = Math.floor(nva / 5);\n    const cond = c.cond || {};\n\n    const deslBase = 6 + Math.floor(num(A.des) / 2) + num(c.bonus.desl);\n    const zero = cond.imobilizado || cond.segurado;\n    const halfWhy = [c.fer >= 1 && 'Ferimento Leve', cond.atordoado && 'Atordoado', cond.derrubado && 'Derrubado'].filter(Boolean);\n    const desl = zero ? 0 : halfWhy.length ? deslBase / 2 : deslBase;\n    const deslNote = zero ? 'Zerado: ' + [cond.imobilizado && 'Imobilizado', cond.segurado && 'Segurado'].filter(Boolean).join(', ') + '.'\n      : halfWhy.length ? `Metade de ${fmtM(deslBase)} por ${halfWhy.join(', ')}.`\n      : `6m + ${Math.floor(num(A.des) / 2)}m da Destreza${num(c.bonus.desl) ? ' + bônus' : ''}.`;\n\n    const resV = RES[c.reserva] || 0;\n    const pochV = 2 * Math.max(0, num(c.pochetes));\n    const espMax = 8 + Math.floor(num(A.for) / 2) + resV + pochV + num(c.bonus.esp);\n    const armEsp = c.armadura.tipo === 'Leve' ? 1 : c.armadura.tipo === 'Pesada' ? 2 : 0;\n    const used = c.itens.reduce((s, i) => s + num(i.esp), 0) + c.armas.reduce((s, w) => s + num(w.esp), 0) + armEsp;\n    const over = used > espMax;\n    const nSlots = Math.min(60, Math.max(espMax, used));\n    const slots = Array.from({ length: nSlots }, (_, i) => {\n      const filled = i < used, extra = i >= espMax;\n      return { bd: extra ? BLOOD : filled ? 'var(--color-accent)' : 'var(--color-neutral-400)', bg: extra ? 'rgba(127,32,32,.18)' : filled ? 'var(--color-accent-200)' : 'transparent' };\n    });\n\n    const gasto = c.itens.reduce((s, i) => s + num(i.preco), 0) + c.armas.reduce((s, w) => s + num(w.preco), 0) + num(c.armPreco);\n    const dinIni = c.dinIni === null || c.dinIni === undefined ? (ess ? ess.r : 0) : num(c.dinIni);\n\n    const benSpent = c.traits.filter(t => t.tipo === 'Benefício' || t.tipo === 'Marca de Origem').reduce((s, t) => s + num(t.pts), 0);\n    const fraq = c.traits.filter(t => t.tipo === 'Fraqueza').reduce((s, t) => s + num(t.pts), 0);\n    const benAvail = 5 + Math.min(5, fraq);\n\n    const attrNotes = {\n      for: `${8 + Math.floor(num(A.for) / 2)} espaços base · empurra ${2 + num(A.for)}m`,\n      ten: `+${3 * num(A.ten)} PV · Bloqueio ${sgn(num(A.ten))}`,\n      des: `+${Math.floor(num(A.des) / 2)}m de Deslocamento · Esquiva ${sgn(num(A.des))}`,\n      men: `${2 + Math.floor(num(A.men) / 2)} Perícias livres · +1 a cada 2 pontos`,\n      esp: `Teste de Horror 3d6 ${sgn(num(A.esp))}`,\n      cha: 'Diplomacia, Persuasão, Enganação…'\n    };\n    const setAttr = (k, d) => this.mut(x => { x.attr[k] = Math.max(0, num(x.attr[k]) + d); });\n    const attrs = ATTR.map(a => ({\n      ...a, v: num(A[a.k]), note: attrNotes[a.k],\n      bd: lim !== null && num(A[a.k]) > lim ? BLOOD : 'var(--color-divider)',\n      inc: () => setAttr(a.k, 1), dec: () => setAttr(a.k, -1)\n    }));\n\n    const setPool = (key, max) => d => this.mut(x => { const cur = x[key] === null ? max : num(x[key]); x[key] = Math.max(0, cur + d); });\n    const pools = [\n      { k: 'PV', l: 'Pontos de Vida', color: BLOOD, cur: pvCur, max: pvMax, pct: Math.max(0, Math.min(100, num(pvCur) / pvMax * 100)) + '%',\n        temp: c.pvTemp, bonus: c.bonus.pv, formula: `20 + ${5 * (nva - 1)} (NVA) + ${3 * num(A.ten)} (Tenacidade)${num(c.bonus.pv) ? ' ' + sgn(num(c.bonus.pv)) : ''}`,\n        dec: () => setPool('pv', pvMax)(-1), inc: () => setPool('pv', pvMax)(1),\n        onCur: e => { const v = e.target.value; this.mut(x => { x.pv = v === '' ? '' : num(v); }); },\n        onTemp: this.bind(c, 'pvTemp').on, onBonus: this.bind(c, 'bonus.pv').on },\n      { k: 'PE', l: 'Pontos de Esforço', color: 'var(--color-accent-600)', cur: peCur, max: peMax, pct: (peMax ? Math.max(0, Math.min(100, num(peCur) / peMax * 100)) : 0) + '%',\n        temp: c.peTemp, bonus: c.bonus.pe, formula: `12 + ${3 * (nva - 1)} (NVA)${num(c.bonus.pe) ? ' ' + sgn(num(c.bonus.pe)) : ''}`,\n        dec: () => setPool('pe', peMax)(-1), inc: () => setPool('pe', peMax)(1),\n        onCur: e => { const v = e.target.value; this.mut(x => { x.pe = v === '' ? '' : num(v); }); },\n        onTemp: this.bind(c, 'peTemp').on, onBonus: this.bind(c, 'bonus.pe').on  'carteira', 'aparencia', 'lacos', 'segredo', 'notas'].forEach(k => { b[k] = this.bind(c, k); });\n    b.pochetes = this.bind(c, 'pochetes'); b.bDesl = this.bind(c, 'bonus.desl'); b.bEsp = this.bind(c, 'bonus.esp'); b.dinIni = this.bind(c, 'dinIni');\n\n    const tabDefs = [['ficha', 'Sobrevivente'], ['inv', 'Inventário'], ['hist', 'Traços e História'], ['cheat', 'Cheat Sheet']];\n    const tabs = tabDefs.map(([k, label]) => ({ label, bd: S.tab === k ? BLOOD : 'transparent', fg: S.tab === k ? 'var(--color-text)' : 'var(--color-neutral-600)', on: () => this.setState({ tab: k }) }));\n    const P = S.printing;\n    const add = (key, item) => () => this.mut(x => { x[key].push({ id: uid(), ...item }); });\n\n    return {\n      c, b, nva, activeId: c.id, confirmDel: S.confirmDel, notConfirm: !S.confirmDel,\n      charOpts: S.chars.map((x, i) => ({ id: x.id, label: (x.nome || 'Sem nome') + (x.essencia ? ' · ' + x.essencia : '') })),\n      onPick: e => this.setState({ activeId: e.target.value, confirmDel: false }),\n      onNew: () => { const n = newChar(); this.setState(s => ({ chars: [...s.chars, n], activeId: n.id, tab: 'ficha', confirmDel: false })); },\n      onDup: () => { const n = { ...JSON.parse(JSON.stringify(c)), id: uid(), nome: (c.nome || 'Sem nome') + ' (cópia)' }; this.setState(s => ({ chars: [...s.chars, n], activeId: n.id })); },\n      onDelAsk: () => this.setState({ confirmDel: true }),\n      onDelCancel: () => this.setState({ confirmDel: false }),\n      onDel: () => this.setState(s => { let chars = s.chars.filter(x => x.id !== c.id); if (!chars.length) chars = [newChar()]; return { chars, activeId: chars[0].id, confirmDel: false }; }),\n      onExport: () => this.exportChar(c),\n      onImportClick: () => this.fileRef.current && this.fileRef.current.click(),\n      onImport: e => this.importFile(e), fileRef: this.fileRef,\n      onPrint: () => this.setState({ printing: true }, () => setTimeout(() => window.print(), 250)),\n      essOpts: [...ESS].so
